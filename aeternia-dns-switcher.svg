<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecca3"/>
      <stop offset="100%" style="stop-color:#00b4d8"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)" stroke="url(#glow)" stroke-width="1.5"/>

  <!-- Globe meridians -->
  <ellipse cx="32" cy="32" rx="13" ry="21" fill="none" stroke="#4ecca3" stroke-width="1" opacity="0.45"/>
  <ellipse cx="32" cy="32" rx="21" ry="21" fill="none" stroke="#4ecca3" stroke-width="1" opacity="0.25"/>

  <!-- Globe latitude lines -->
  <line x1="11" y1="32" x2="53" y2="32" stroke="#4ecca3" stroke-width="0.9" opacity="0.4"/>
  <path d="M 13 22 Q 32 17 51 22" fill="none" stroke="#4ecca3" stroke-width="0.9" opacity="0.35"/>
  <path d="M 13 42 Q 32 47 51 42" fill="none" stroke="#4ecca3" stroke-width="0.9" opacity="0.35"/>

  <!-- DNS label -->
  <text x="32" y="38"
        text-anchor="middle"
        fill="url(#glow)"
        font-family="'Courier New',monospace,sans-serif"
        font-size="14"
        font-weight="bold"
        letter-spacing="2">DNS</text>
</svg>
